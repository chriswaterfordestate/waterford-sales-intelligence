version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: waterford
      POSTGRES_PASSWORD: waterford_dev
      POSTGRES_DB: waterford_si
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterford -d waterford_si"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: waterford
      POSTGRES_PASSWORD: waterford_dev
      POSTGRES_DB: waterford_si_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterford -d waterford_si_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
