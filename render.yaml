# Waterford Sales Intelligence — Render.com deployment configuration
# docs: https://render.com/docs/yaml-spec

services:
  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: waterford-si-api
    runtime: python
    region: oregon          # change to eu-west or nearest Render region
    plan: starter           # upgrade to standard for production SLA
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
      --log-level info
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: waterford-si-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CLERK_SECRET_KEY
        sync: false           # set manually in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        sync: false           # set to frontend URL after deployment
      - key: LOG_LEVEL
        value: info

  # ── Frontend (React static site) ──────────────────────────────────────────
  - type: web
    name: waterford-si-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false           # set to backend URL after deployment
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: waterford-si-db
    databaseName: waterford_si
    user: waterford
    plan: basic-256mb             # includes automated daily backups and 7-day retention
    region: oregon            # match web service region

# NOTE: Redis/Celery is NOT required for current functionality.
# All import processing is synchronous. If background imports are needed
# later, add a Redis instance and Celery worker service here.
